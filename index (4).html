
<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <title>Malingskatalog</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>🎨 Min Warhammer Malingskatalog</h1>
    <p>Oppdatert oversikt over alle malinger jeg eier.</p>
    <table id="paintTable">
        <thead>
            <tr>
                <th>Kategori</th>
                <th>Maling</th>
                <th>Status</th>
            </tr>
        </thead>
        <tbody>
        </tbody>
    </table>

    <script>
    fetch('malingskatalog.csv')
        .then(response => response.text())
        .then(data => {
            const rows = data.split('\n').slice(1);
            const tbody = document.querySelector('#paintTable tbody');
            rows.forEach(row => {
                if (row.trim() === "") return;
                const cols = row.split(',');
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${cols[1]}</td>
                    <td>${cols[2]}</td>
                    <td>${cols[3]}</td>
                `;
                tbody.appendChild(tr);
            });
        });
    </script>
</body>
</html>
